{{ define "title"}} {{.Item.Meta.Title}} {{end}}

{{define "content"}}

<div>
  <div class="mx-auto text-3xl mb-16">
    <a href="/posts" class="inline-block py-2 text-white rounded hover:bg-amber-500 transition">
    ← Back
  </a>
  </div>

  <div class="mx-auto text-3xl">
    {{with .Item}}
        <div class="text-2xl">{{.Meta.Title}}</div>
        <div>
            <article class="prose dark:prose-invert prose-lg max-w-none list-inside">
                  {{.Content}}
            </article>
        </div>
    {{end}}
    </div>

    <div class="flex gap-4 p-4 mt-16">
      <div class="mx-auto text-2xl mb-16">
        {{if .Prev}}
                {{with .Prev.Meta}}
                <a href="{{.Slug}}">← Previous post</a> 
                {{end}}
            {{else}}
                
            {{end}}
      </div>

      <div class="mx-auto text-2xl mb-16">
        {{if .Next}}
                {{with .Next.Meta}}
                <a href="{{.Slug}}">Next post →</a> 
                {{end}}
            {{else}}
                
            {{end}}
      </div>
    </div>
</div>

{{end}}
