{{define "title"}}Posts{{end}}

{{define "main"}}
    <h1>Latest post:</h1>
    {{if .Items}}
        {{range .Items}}
            {{with .Meta}}
            <li>
                <a href="{{.Slug}}">{{.Title}}</a>
            </li>
            {{end}}
        {{end}}

    {{else}}
        <p>There's nothing to see here.</p>
    {{end}}
{{end}}
