{{define "title"}}Posts{{end}}

{{define "content"}}

<main class="max-w-5xl mx-auto">
  <!-- Posts -->
  <h2 class="text-md uppercase tracking-wide mb-6">
   All posts
  </h2>

  {{if .Items}}
    <ul class="space-y-3">
      {{range .Items}}
        {{with .Meta}}
        <li class="flex gap-4">
          <span class="w-32 shrink-0 tabular-nums">
            {{.Date.Format "2006 Jan 02"}}
          </span>
          <a href="{{.Slug}}">
            {{.Title}}
          </a>
        </li>


        {{end}}
      {{end}}
    </ul>
  {{else}}
    <p>There’s nothing to see here.</p>
  {{end}}

</main>
{{end}}
