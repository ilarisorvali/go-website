{{define "title"}}Posts{{end}}

{{define "content"}}

<div class="flex items-center justify-between w-full mb-8">
    <h1 class="md:text-xl font-semibold">All posts</h1>
    <span class="md:text-xl">
      Atom <a href="/atom.xml">feed</a> for posts
    </span>
</div>

<div>
  <!-- Posts -->
  {{if .Items}}
    <ul class="space-y-2">
      {{range .Items}}
        {{with .Meta}}
        <li class="gap-4 md:text-xl">
          <a href="{{.Slug}}"
              > {{.Title}}
          </a>

          <div class="text-sm">
            {{.Date.Format "02 Jan 2006"}}
          </div>

          <p class="text-sm">
              {{.Description}}
          </p>

        </li>
        {{end}}
      {{end}}
    </ul>
  {{else}}
    <p>There’s nothing to see here.</p>
  {{end}}

</div>
{{end}}
